<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bốc Thăm Giỏ Hàng Online</title>
    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: var(--card);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 { text-align: center; color: #fbbf24; margin-bottom: 8px; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: 14px; }
        
        /* Trạng thái 6 giỏ hàng */
        .baskets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .basket-item {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #38bdf8;
            transition: all 0.3s;
        }
        .basket-item.taken {
            background: #334155;
            color: #64748b;
            text-decoration: line-through;
            border-color: transparent;
            opacity: 0.6;
        }

        /* Form nhập liệu */
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #fbbf24; }
        
        button#drawBtn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s, opacity 0.2s;
        }
        button#drawBtn:hover:not(:disabled) { background: linear-gradient(135deg, #fbbf24, #b45309); }
        button#drawBtn:active:not(:disabled) { transform: scale(0.98); }
        button#drawBtn:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }

        /* Thanh Loading 3s */
        .loading-box { display: none; margin-top: 20px; text-align: center; }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #0f172a;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid #334155;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #fbbf24);
            transition: width 3s linear;
        }

        /* Lịch sử bốc thăm */
        .history { margin-top: 28px; border-top: 1px solid #334155; padding-top: 20px; }
        .history h3 { font-size: 15px; color: #cbd5e1; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .history-list { list-style: none; }
        .history-list li {
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-left: 4px solid #fbbf24;
        }
        .reset-btn {
            background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer; text-decoration: underline;
        }

        /* Popup chung */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }
        .modal {
            background: #1e293b;
            border: 2px solid #fbbf24;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: popIn 0.25s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-icon { font-size: 48px; margin-bottom: 12px; }
        .modal h2 { color: #fbbf24; margin-bottom: 12px; font-size: 20px; }
        .modal p { font-size: 16px; line-height: 1.5; margin-bottom: 20px; color: #f8fafc; }
        .modal p strong { color: #38bdf8; font-size: 20px; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
        .btn-confirm {
            padding: 10px 24px; background: #fbbf24; color: #0f172a;
            border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;
        }
        .btn-danger {
            padding: 10px 24px; background: #ef4444; color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;
        }
        .btn-cancel {
            padding: 10px 20px; background: #334155; color: #cbd5e1;
            border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;
        }
        .error-text { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bốc Thăm Giỏ Hàng</h1>
    <p class="subtitle">Dành cho 6 Leader • Mỗi người chỉ được bốc 1 lần</p>

    <!-- Hiển thị trạng thái 6 giỏ hàng -->
    <div class="baskets-grid" id="basketsGrid"></div>

    <!-- Khu vực nhập thông tin -->
    <div class="input-group">
        <label for="leaderName">Nhập tên Leader:</label>
        <input type="text" id="leaderName" placeholder="Ví dụ: Nguyễn Văn A" autocomplete="off">
    </div>

    <button id="drawBtn" onclick="startDraw()">Bốc Thăm Giỏ Hàng</button>

    <!-- Thanh Loading 3 giây -->
    <div class="loading-box" id="loadingBox">
        <span style="font-size: 14px; color: #fbbf24;">Đang quay số ngẫu nhiên...</span>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Bảng kết quả đã bốc -->
    <div class="history">
        <h3>
            <span>Kết quả đã bốc (<span id="countText">0</span>/6)</span>
            <button class="reset-btn" onclick="openResetModal()">Làm mới dữ liệu</button>
        </h3>
        <ul class="history-list" id="historyList"></ul>
    </div>
</div>

<!-- Popup thông báo trúng thưởng -->
<div class="modal-overlay" id="resultModal">
    <div class="modal">
        <div class="modal-icon">🎉</div>
        <h2>KẾT QUẢ BỐC THĂM</h2>
        <p id="popupMessage"></p>
        <button class="btn-confirm" onclick="closeModal()">Xác nhận</button>
    </div>
</div>

<!-- Popup nhập mật khẩu làm mới dữ liệu -->
<div class="modal-overlay" id="resetModal">
    <div class="modal" style="border-color: #ef4444;">
        <div class="modal-icon">🔒</div>
        <h2 style="color: #ef4444;">XÁC NHẬN QUẢN TRỊ</h2>
        <p style="font-size: 14px; color: #cbd5e1; margin-bottom: 12px;">Nhập mật khẩu để xóa toàn bộ kết quả và bắt đầu lượt mới:</p>
        <input type="password" id="adminPassword" placeholder="Nhập mật khẩu..." onkeyup="if(event.key==='Enter') confirmReset()">
        <div class="error-text" id="passError">Mật khẩu không chính xác!</div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeResetModal()">Hủy</button>
            <button class="btn-danger" onclick="confirmReset()">Xóa dữ liệu</button>
        </div>
    </div>
</div>

<script>
    const TOTAL_BASKETS = [1, 2, 3, 4, 5, 6];
    const ADMIN_PASS = "Myha1010";

    let availableBaskets = JSON.parse(localStorage.getItem('availableBaskets')) || [...TOTAL_BASKETS];
    let drawHistory = JSON.parse(localStorage.getItem('drawHistory')) || [];
    let isDrawing = false;

    function renderUI() {
        const grid = document.getElementById('basketsGrid');
        grid.innerHTML = '';
        TOTAL_BASKETS.forEach(num => {
            const isAvailable = availableBaskets.includes(num);
            const div = document.createElement('div');
            div.className = `basket-item ${isAvailable ? '' : 'taken'}`;
            div.innerText = isAvailable ? `Giỏ hàng số ${num}` : `Giỏ số ${num} (Đã bốc)`;
            grid.appendChild(div);
        });

        const list = document.getElementById('historyList');
        list.innerHTML = '';
        drawHistory.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span>Leader: <strong>${item.name}</strong></span> <span style="color:#fbbf24; font-weight:bold;">Giỏ hàng số ${item.basket}</span>`;
            list.appendChild(li);
        });

        document.getElementById('countText').innerText = drawHistory.length;
        const drawBtn = document.getElementById('drawBtn');
        const nameInput = document.getElementById('leaderName');

        if (availableBaskets.length === 0) {
            drawBtn.disabled = true;
            drawBtn.innerText = 'Đã hết giỏ hàng';
            nameInput.disabled = true;
        } else {
            drawBtn.disabled = false;
            drawBtn.innerText = 'Bốc Thăm Giỏ Hàng';
            nameInput.disabled = false;
        }
    }

    function startDraw() {
        if (isDrawing) return;

        const nameInput = document.getElementById('leaderName');
        const rawName = nameInput.value.trim();

        if (!rawName) {
            alert('Vui lòng nhập tên Leader trước khi bốc thăm!');
            nameInput.focus();
            return;
        }

        const alreadyDrawn = drawHistory.some(item => item.name.toLowerCase() === rawName.toLowerCase());
        if (alreadyDrawn) {
            alert(`Anh "${rawName}" đã bốc thăm rồi! Mỗi Leader chỉ được bốc 1 lần.`);
            return;
        }

        if (availableBaskets.length === 0) {
            alert('Tất cả 6 giỏ hàng đã được bốc hết!');
            return;
        }

        isDrawing = true;
        document.getElementById('drawBtn').disabled = true;
        nameInput.disabled = true;

        const loadingBox = document.getElementById('loadingBox');
        const progressFill = document.getElementById('progressFill');
        
        loadingBox.style.display = 'block';
        progressFill.style.transition = 'none';
        progressFill.style.width = '0%';
        
        setTimeout(() => {
            progressFill.style.transition = 'width 3s linear';
            progressFill.style.width = '100%';
        }, 50);

        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * availableBaskets.length);
            const selectedBasket = availableBaskets[randomIndex];

            availableBaskets.splice(randomIndex, 1);

            drawHistory.push({ name: rawName, basket: selectedBasket });
            localStorage.setItem('availableBaskets', JSON.stringify(availableBaskets));
            localStorage.setItem('drawHistory', JSON.stringify(drawHistory));

            loadingBox.style.display = 'none';
            nameInput.value = '';
            isDrawing = false;

            renderUI();
            showPopup(rawName, selectedBasket);
        }, 3050);
    }

    function showPopup(leaderName, basketNumber) {
        const msg = document.getElementById('popupMessage');
        msg.innerHTML = `Chúc mừng anh <strong>"${leaderName}"</strong> đã bốc được <strong>giỏ hàng số ${basketNumber}</strong>`;
        document.getElementById('resultModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('resultModal').style.display = 'none';
    }

    // Xử lý mở/đóng và xác thực mật khẩu Reset
    function openResetModal() {
        document.getElementById('adminPassword').value = '';
        document.getElementById('passError').style.display = 'none';
        document.getElementById('resetModal').style.display = 'flex';
        setTimeout(() => document.getElementById('adminPassword').focus(), 100);
    }

    function closeResetModal() {
        document.getElementById('resetModal').style.display = 'none';
    }

    function confirmReset() {
        const inputPass = document.getElementById('adminPassword').value;
        if (inputPass === ADMIN_PASS) {
            localStorage.removeItem('availableBaskets');
            localStorage.removeItem('drawHistory');
            availableBaskets = [...TOTAL_BASKETS];
            drawHistory = [];
            closeResetModal();
            renderUI();
        } else {
            document.getElementById('passError').style.display = 'block';
            document.getElementById('adminPassword').focus();
        }
    }

    renderUI();
</script>

</body>
</html>
